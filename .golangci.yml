version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - importas
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usetesting
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    godox:
      keywords:
        - FIXME
        - BUG
    nestif:
      min-complexity: 6
    wrapcheck:
      extra-ignore-sigs:
        - elephantine.InvalidArgumentf(
        - elephantine.RequireAnyScope(
        - howdah.NewHTTPError
        - howdah.HTTPErrorf
        - .RequireAuth(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # elephantine deprecated its Twirp error and scope helpers in favour of
      # the connect.Error returning ones in elephantine/rpc. The replicant is
      # still a Twirp service, so the Twirp shaped errors are the ones its
      # handlers have to return; these go with the Twirp mount, not before it.
      - linters:
          - staticcheck
        text: "SA1019: github.com/ttab/elephantine.(RequireAnyScope|InvalidArgumentf|IsTwirpErrorCode) is deprecated"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
