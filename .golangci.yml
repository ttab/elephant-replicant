version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - importas
    - lll
    - makezero
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usetesting
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    goconst:
      # Test-file issues are already excluded below; don't let test
      # literals inflate the occurrence counts for production code either.
      ignore-tests: true
    godox:
      keywords:
        - FIXME
        - BUG
    modernize:
      disable:
        # embedlit suggests eliding the type of an embedded field in a
        # struct literal, which the Go 1.27 compiler rejects with "missing
        # type in composite literal".
        - embedlit
    nestif:
      min-complexity: 6
    wrapcheck:
      extra-ignore-sigs:
        # The elephantine/rpc helpers construct RPC errors. Wrapping one would
        # bury the code the handler picked, which is the whole point of it.
        - github.com/ttab/elephantine/rpc.
        - elephantine.InvalidArgumentf(
        - elephantine.RequireAnyScope(
        - (context.Context).Err(
        - github.com/ttab/elephantine/pg.WithTX(
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
          - gosec
        path: _test\.go
      # A test that checks what the server answered passes the RPC error
      # through verbatim; wrapping it would only get in the way.
      - linters:
          - wrapcheck
        path: _test\.go
      # elephantine deprecated its Twirp error and scope helpers in favour of
      # the connect.Error returning ones in elephantine/rpc. The replicant
      # handlers still return Twirp errors, which the Connect mount translates
      # on the way out; the exclusion goes with the move to rpc errors.
      - linters:
          - staticcheck
        text: "SA1019: github.com/ttab/elephantine.(RequireAnyScope|InvalidArgumentf|IsTwirpErrorCode) is deprecated"
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
